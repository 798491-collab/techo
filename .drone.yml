# ============================================================
# Drone CI 流水线（唯一部署入口）—— push 自动 + promote/rollback 生产部署
# 链路：git push → Gitee WebHook → Drone push 构建（CI 校验）→ 自动 promote
#       → 生产构建（event=promote）→ 8300 接收器 → k3s-deploy.sh
# Deployments 页：promote / rollback 会写入部署记录（target=production），
#                 支持一键回滚（rollback 事件走同一条部署步骤）。
# 运行器：exec runner（直接在宿主机执行，无需 Docker、无需 privileged）
# 安全：入站推送由仓库 repo.Signer 验签；Drone API token 在服务器
#       k8s/secrets/drone-token.txt（gitignore，不入库）
# ============================================================
kind: pipeline
type: exec
name: deploy-pysite

trigger:
  event:
    - push
    - custom
    - promote
    - rollback

# 代码已在宿主机 /www/wwwroot/pysite，禁用默认 clone（此前 clone: skip 是
# Drone 0.8 老语法不生效，曾因 Gitee 网络 TLS 中断导致构建失败）
clone:
  disable: true

steps:
  # ---------- push / 手动构建：CI 校验 + 自动晋升生产 ----------
  - name: 校验并晋升生产
    when:
      event:
        - push
        - custom
    commands:
      - |
        set -e -o pipefail
        echo "===== CI 校验 $(date '+%F %T') commit ${DRONE_COMMIT_SHA:0:8} ====="
        # exec runner 运行用户与仓库属主不同，需豁免 safe.directory 才能操作仓库
        git config --global --add safe.directory /www/wwwroot/pysite
        # 宿主机仓库还停在上一发版，先拉取本次提交（Gitee 网络偶发抖动，带重试）
        cd /www/wwwroot/pysite
        for i in 1 2 3; do
          git fetch origin main --quiet && break || { echo "fetch 第 $i 次失败，重试..."; sleep 5; }
        done
        git cat-file -e "$DRONE_COMMIT_SHA" || git fetch origin main --unshallow --quiet || true
        rm -rf /tmp/ci-check && mkdir -p /tmp/ci-check
        git archive "$DRONE_COMMIT_SHA" | tar -x -C /tmp/ci-check
        find /tmp/ci-check/sites -name '*.py' -print0 | xargs -0 -n1 python3 -m py_compile \
          && echo "五站源码编译校验通过"
        rm -rf /tmp/ci-check
        # 校验通过 → 自动 promote 到 production（写入 Deployments 记录并触发生产构建）
        # 注：exec runner 不注入 DRONE_SERVER 等部分变量，runner 又跑在宿主机上，
        #     直接用本机地址并回退仓库名称
        TOKEN=$(tr -d '\r\n' < /www/wwwroot/pysite/k8s/secrets/drone-token.txt)
        SERVER="${DRONE_SERVER:-http://127.0.0.1:30080}"
        NS="${DRONE_REPO_NAMESPACE:-donghaichen}"
        NAME="${DRONE_REPO_NAME:-techo}"
        echo "晋升生产环境... server=$SERVER ns=$NS name=$NAME build=$DRONE_BUILD_NUMBER"
        RESP=$(curl -fsS -X POST -H "Authorization: Bearer $TOKEN" \
          "$SERVER/api/repos/$NS/$NAME/builds/$DRONE_BUILD_NUMBER/promote?target=production")
        echo "$RESP" | head -c 300
        echo
        echo "已创建生产构建"

  # ---------- promote / rollback 构建：真正的部署 ----------
  - name: 触发五站部署
    when:
      event:
        - promote
        - rollback
    commands:
      - |
        set -e
        LOG=/www/wwwroot/pysite/scripts/k3s-deploy.log
        TOKEN=$(tr -d '\r\n' < /www/wwwroot/pysite/k8s/secrets/webhook-token.txt)
        echo "===== 部署 $(date '+%F %T') [触发: $DRONE_BUILD_EVENT / target: $DRONE_DEPLOY_TO] ====="
        echo "分支 $DRONE_BRANCH / 提交 ${DRONE_COMMIT_SHA:0:8}"
        BEFORE=$(wc -l < "$LOG" 2>/dev/null || echo 0)
        curl -fsS "http://127.0.0.1:8300/hook?token=$TOKEN"
        echo "已提交到部署队列，等待结果（最长 900s）..."
        for i in $(seq 1 900); do
          NEW=$(tail -n +$((BEFORE+1)) "$LOG" 2>/dev/null || true)
          if echo "$NEW" | grep -q '部署完成'; then
            echo "$NEW"; echo "部署成功"; exit 0
          fi
          if echo "$NEW" | grep -qE '回滚完成|部署失败'; then
            echo "$NEW"; echo "部署失败已自动回滚"; exit 1
          fi
          sleep 1
        done
        echo "等待超时，请手动查看: tail -f $LOG"
        exit 1
