apiVersion: apps/v1
kind: Deployment
metadata:
  name: pysite-hefei
  namespace: pysite
  labels:
    app: pysite-hefei
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: pysite-hefei
  template:
    metadata:
      labels:
        app: pysite-hefei
      annotations:
        kubernetes.io/change-cause: "发版 __COMMIT__: __SUBJECT__"
        pysite/commit: "__COMMIT__"
        pysite/commit-subject: "__SUBJECT__"
        pysite/deployed-at: "__DEPLOYED_AT__"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: web
          image: docker.io/library/python:3.10-slim
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/python", "scripts/serve.py"]
          workingDir: /app
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONPATH
              value: "/opt/venv/lib/python3.10/site-packages"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYSITE_SITE
              value: "hefei"
          ports:
            - name: http
              containerPort: 8102
          livenessProbe:
            tcpSocket:
              port: 8102
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8102
            initialDelaySeconds: 18
            periodSeconds: 15
          volumeMounts:
            - name: site
              mountPath: /app
            - name: packages
              mountPath: /opt/venv/lib/python3.10/site-packages
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: site
          hostPath:
            path: /www/wwwroot/pysite/sites/hefei
            type: Directory
        - name: packages
          hostPath:
            path: /www/wwwroot/pysite/venv/lib/python3.10/site-packages
            type: Directory
      restartPolicy: Always
