apiVersion: apps/v1
kind: Deployment
metadata:
  name: pysite-wuxi
  namespace: pysite
  labels:
    app: pysite-wuxi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pysite-wuxi
  template:
    metadata:
      labels:
        app: pysite-wuxi
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: web
          image: docker.io/library/python:3.10-slim
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/python", "scripts/serve.py"]
          workingDir: /app
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONPATH
              value: "/opt/venv/lib/python3.10/site-packages"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYSITE_SITE
              value: "wuxi"
          ports:
            - name: http
              containerPort: 8104
              hostPort: 8104
          livenessProbe:
            tcpSocket:
              port: 8104
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8104
            initialDelaySeconds: 8
            periodSeconds: 15
          volumeMounts:
            - name: site
              mountPath: /app
            - name: packages
              mountPath: /opt/venv/lib/python3.10/site-packages
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: site
          hostPath:
            path: /www/wwwroot/pysite/sites/wuxi
            type: Directory
        - name: packages
          hostPath:
            path: /www/wwwroot/pysite/venv/lib/python3.10/site-packages
            type: Directory
      restartPolicy: Always
