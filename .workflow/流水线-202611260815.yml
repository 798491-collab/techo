version: "1.0"
name: 手动部署（Build Now）
displayName: 手动部署（Build Now）
# 只在页面点「运行」时触发，不随 git push 自动跑。
# 现有 git push -> webhook -> 自动部署链路保持不动，二者互不干扰。
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true

stages:
  - name: 部署五站点
    displayName: 部署五站点
    strategy: naturally
    trigger: auto
    steps:
      - step: shell@agent
        name: deploy
        displayName: 执行 k3s 部署脚本
        hostGroupID: pysite-server
        script: |
          set -e
          REPO=/www/wwwroot/pysite
          RUN=$(mktemp /tmp/pysite-deploy-XXXXXX.sh)
          cp "$REPO/k8s/k3s-deploy.sh" "$RUN"
          chmod +x "$RUN"
          trap 'rm -f "$RUN"' EXIT
          bash "$RUN"
          echo "===== 部署完成，站点状态 ====="
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          kubectl -n pysite get pod -o wide
        notify: []
        strategy:
          retry: "0"
          resource:
            cpu: "1"
            memory: "1"
