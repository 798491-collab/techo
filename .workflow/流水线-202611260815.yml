version: "1.0"
name: 构建、镜像构建、部署到Kubernetes集群
displayName: 构建、镜像构建、部署到Kubernetes集群
stages:
- name: 构建
  displayName: 构建
  strategy: naturally
  trigger: auto
  steps:
  - step: build@python
    name: ""
    displayName: Python 构建
    pythonVersion: "3.9"
    commands:
    - pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
    - "# 可以使用pip下载依赖"
    - "# pip install --user -r requirements.txt"
    - python --version
    artifacts:
    - name: BUILD_ARTIFACT
      path:
      - ./
      type: .tar.gz
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 镜像构建
  displayName: 镜像构建
  strategy: naturally
  trigger: auto
  steps:
  - step: build@docker
    name: ""
    displayName: 镜像构建
    type: account
    repository: ""
    username: ""
    password: ""
    tag: "${GITEE_PIPELINE_BUILD_NUMBER}"
    dockerfile: ./Dockerfile
    context: ""
    artifacts: "${BUILD_ARTIFACT}"
    isCache: false
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 部署
  displayName: 部署
  strategy: naturally
  trigger: auto
  steps:
  - step: deploy@k8s
    name: ""
    displayName: K8S部署
    version: v1.16.4
    certificate: "{explicitNull=true}"
    namespace: default
    yaml: ./deployment.yaml
    isReplace: "{explicitNull=true}"
    skiptls: "{explicitNull=true}"
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true
