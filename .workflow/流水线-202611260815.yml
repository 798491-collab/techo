version: "1.0"
name: 手动部署（Build Now）
displayName: 手动部署（Build Now）

triggers:
  trigger: manual
notify: []
strategy:
  blocking: true

stages:
  - name: 部署五站点
    displayName: 部署五站点
    strategy: naturally
    trigger: auto
    steps:
      - step: shell@host            # ← 关键：主机执行类型，不要写 shell@agent
        name: deploy
        displayName: 执行 k3s 部署脚本
        hostGroupID: pysite-server
        script: |
          set -e
          LOCK=/tmp/pysite-deploy.lock
          exec 9>"$LOCK"
          if ! flock -n 9; then
            echo "部署任务正在运行，拒绝重复执行"
            exit 1
          fi
          REPO=/www/wwwroot/pysite
          RUN=$(mktemp /tmp/pysite-deploy-XXXXXX.sh)
          cp "$REPO/k8s/k3s-deploy.sh" "$RUN"
          chmod +x "$RUN"
          trap 'rm -f "$RUN"' EXIT
          bash "$RUN"
          echo "===== 部署完成，站点状态 ====="
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          kubectl -n pysite get pod -o wide
        notify: []
        strategy:
          retry: "0"
          resource:
            cpu: "1"
            memory: "1"
