# hefeizhupin.com -> 127.0.0.1:8102  (PySite hefeizhupin)
server {
    listen 80;
    server_name hefeizhupin.com www.hefeizhupin.com;

    # 敏感文件/目录一律拒绝
    location ~* (/\.git|/\.env|\.(db|log|sql|bak|ini|py|sh)$) { return 404; }

    # 上传文件、主题文件由站点进程送出，这里只做整站转发。

    location / {
        proxy_pass http://10.43.100.102:8102;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-Port $remote_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    access_log /www/wwwlogs/hefeizhupin.com.log;
    error_log  /www/wwwlogs/hefeizhupin.com.error.log;
}
